[package]
name = "zstd_stream"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "zstd_stream"
path = "src/lib.rs"

[dependencies]
guild_rt = { workspace = true }
rustler = { workspace = true, optional = true }
zstd-safe = { workspace = true, features = ["std"] }

[features]
nif = ["dep:rustler"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "zstd"
harness = false
