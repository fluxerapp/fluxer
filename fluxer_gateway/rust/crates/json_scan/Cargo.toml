[package]
name = "json_scan"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "json_scan"
path = "src/lib.rs"

[dependencies]
memchr = { workspace = true }
guild_rt = { workspace = true, optional = true }
rustler = { workspace = true, optional = true }

[features]
nif = ["dep:rustler", "dep:guild_rt"]

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "scan"
harness = false
