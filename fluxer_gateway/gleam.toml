name = "fluxer_gateway"
version = "0.0.0"
description = "Fluxer realtime gateway"
licences = ["AGPL-3.0-or-later"]
target = "erlang"
gleam = ">= 1.11.0"

[erlang]
application_start_module = "fluxer_gateway@app@application"
extra_applications = ["crypto", "public_key", "ssl", "inets"]

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
glisten = ">= 9.0.1 and < 10.0.0"
logging = ">= 1.5.0 and < 2.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
bouncer_proto = { path = "bouncer_proto" }

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
