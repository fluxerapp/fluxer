# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "fluxer-push"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "fluxer_push"
path = "src/lib.rs"

[[bin]]
name = "fluxer-push"
path = "src/main.rs"

[dependencies]
fluxer-svc = { path = "../fluxer_svc", default-features = false }
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hmac = "0.13.0"
percent-encoding = "2.3.2"
p256 = { version = "0.13.2", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "pem", "std"] }
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
