domain: ""

image:
  repository: ghcr.io/fluxerapp/fluxer
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

config: {}

existingSecret: ""

postgres:
  externalSecret: ""
  externalSecretKey: uri

persistence:
  size: 20Gi
  storageClass: ""
  annotations: {}
  existingClaim: ""

maintenance: false

edge:
  mode: ""
  trustedProxies: private_ranges
  expose: loadBalancer
  loadBalancer:
    loadBalancerIP: ""
    http3: false

ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: true
    secretName: ""

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  timeouts:
    request: 0s

voice:
  mode: bundled
  expose: hostPort
  publicIP: ""
  nodePorts:
    tcp: 30881
    udp: 30882
  service:
    annotations: {}
    loadBalancerIP: ""

backup:
  schedule: ""
  keep: 7
  hour: 3
  persistence:
    enabled: false
    size: 20Gi
    storageClass: ""
    existingClaim: ""

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 3Gi

shmSize: 256Mi

terminationGracePeriodSeconds: 130

networkPolicy:
  enabled: false
  from: []

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
service:
  annotations: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
extraContainers: []
initContainers: []
