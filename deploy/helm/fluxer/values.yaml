  extraVolumeMounts: []

appProxy:
  replicas: 1
  # Settings for app-proxy only: branding, CSP extras, the index upstream,
  # same-origin hosts and manifest scope, as NAME: value. For example
  # FLUXER_APP_PRODUCT_NAME, FLUXER_CSP_EXTRA_CONNECT_SRC or RUST_LOG.
  config: {}
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  env: {}
  extraEnv: []
  probes: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  pdb: {}
  hpa: {}
