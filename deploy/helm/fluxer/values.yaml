# The internal services. Each runs a router Deployment and a shard StatefulSet.
# router and shard take the workload keys above. shard.replicas sets the shard count.
svc:
  gifs:
    router:
      replicas: 1
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    shard:
      replicas: 1
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
  messages:
    router:
      replicas: 1
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    shard:
      replicas: 1
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
  snowflakes:
    router:
      replicas: 1
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    shard:
      replicas: 1
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
  unfurl:
    router:
      replicas: 1
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    shard:
      replicas: 1
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
  users:
    router:
      replicas: 1
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
    shard:
      replicas: 1
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}

edge:
  image:
    repository: caddy
    tag: 2.11-alpine
    digest: ""
    pullPolicy: IfNotPresent
  # How traffic reaches the edge. ingress puts an Ingress in front of it,
  # gateway an HTTPRoute, loadBalancer a LoadBalancer Service with its own TLS,
  # and none leaves only the ClusterIP Service edge on port 8080.
  expose: ingress
  ingress:
    # The IngressClass. Empty uses the cluster default.
    className: ""
    # Extra annotations. The chart always adds the ingress-nginx body size and
    # timeout annotations, which other controllers ignore.
    annotations: {}
    tls:
      # certManager issues a certificate through a namespaced ACME Issuer.
      # existingSecret uses secretName. none serves plain HTTP behind the controller.
      mode: certManager
      secretName: fluxer-tls
      acmeServer: https://acme-v02.api.letsencrypt.org/directory
  gateway:
    # The Gateway the HTTPRoute attaches to, as Gateway API parentRefs.
    parentRefs: []
    # HTTPRoute timeouts, for example {request: 0s}. Envoy-based gateways cut
    # requests at 15 seconds without it.
    timeouts: {}
  loadBalancer:
    # Also publish UDP 443 for HTTP/3. Some clouds cannot mix TCP and UDP on one Service.
    http3: false
    annotations: {}
    # Size of the volume that keeps the certificates.
    persistence:
      size: 1Gi
      storageClassName: ""
  replicas: 1
  # Edge settings as NAME: value, overriding the chart's, for example
  # FLUXER_EDGE_GLOBAL_OPTIONS or FLUXER_EDGE_ENCODE.
  env: {}
  extraEnv: []
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

networkPolicy:
  # Admit traffic to the release pods only from the release itself, to the edge
  # from anywhere, and to the LiveKit media ports. Network plugins without
  # NetworkPolicy support ignore it. Add a NetworkPolicy of your own to let
  # another namespace in, for example a metrics scraper.
  enabled: true
  # Namespaces allowed to reach the edge on port 8080, as a namespaceSelector,
  # for example {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}.
  # Empty allows any source.
  ingressNamespaceSelector: {}
