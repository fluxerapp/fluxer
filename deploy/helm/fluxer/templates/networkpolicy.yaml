{{- if .Values.networkPolicy.enabled }}
{{- include "fluxer.validate" . }}
{{- $v := .Values }}
{{- $voice := include "fluxer.voicePorts" . | fromJson }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fluxer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fluxer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fluxer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if eq (include "fluxer.edgeMode" .) "bundled" }}
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 443
          protocol: UDP
    {{- else }}
    - ports:
        - port: 8080
          protocol: TCP
      {{- with $v.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "fluxer.name" $ }}-test
              app.kubernetes.io/instance: {{ $.Release.Name }}
      {{- end }}
    {{- end }}
    {{- if eq $v.voice.mode "bundled" }}
    - ports:
        - port: {{ $voice.tcp }}
          protocol: TCP
        - port: {{ $voice.udp }}
          protocol: UDP
    {{- end }}
{{- end }}
