{{- include "fluxer.validate" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: fluxer-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fluxer.labels" (dict "root" . "name" "fluxer-env" "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $val := omit (include "fluxer.secretData" . | fromJson) "FLUXER_ACTIVITYPUB_SIGNING_KEY_BASE64" }}
  {{ $k }}: {{ $val | b64enc | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: fluxer-unfurl-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fluxer.labels" (dict "root" . "name" "fluxer-unfurl-env" "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- with get (include "fluxer.secretData" . | fromJson) "FLUXER_ACTIVITYPUB_SIGNING_KEY_BASE64" }}
data:
  FLUXER_ACTIVITYPUB_SIGNING_KEY_BASE64: {{ . | b64enc | quote }}
{{- end }}
{{- end }}
