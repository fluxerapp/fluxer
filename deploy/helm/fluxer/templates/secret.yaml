{{- include "fluxer.validate" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: fluxer-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fluxer.labels" (dict "root" . "name" "fluxer-env" "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $val := include "fluxer.secretData" . | fromJson }}
  {{ $k }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}
