image:
  registry: ghcr.io/fluxerapp
  tag: v1
  pullPolicy: IfNotPresent

imagePullSecrets: []

env: {}

extraEnv: []

envFrom:
  - secretRef:
      name: fluxer-env

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    httpGet:
      path: /_health
      port: http
  readiness:
    httpGet:
      path: /_health
      port: http

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

topologySpreadConstraints: []

nodeSelector: {}

tolerations: []

affinity: {}

workloads:
  media-proxy:
    mode: mp
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  uploads:
    mode: relay
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 512Mi
