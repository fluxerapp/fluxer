<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Fluxer Updater</title>
		<link rel="stylesheet" href="./index.css" />
	</head>
	<body>
		<div id="splash-mount">
			<div id="splash">
				<div class="splash-inner">
					<div class="splash-media">
						<img class="splash-mark" width="88" height="88" src="./symbol.svg" alt="" />
					</div>
					<div class="splash-text">
						<span class="splash-status">Checking for updates…</span>
						<div class="progress-placeholder">&nbsp;</div>
						<span class="splash-metrics">&nbsp;</span>
						<div class="splash-action-slot"></div>
					</div>
				</div>
				<div class="splash-diagnostics">
					<button class="splash-diagnostics-link" data-action="open-logs">Open logs</button>
					<button class="splash-diagnostics-link" data-action="copy-diagnostics">Copy diagnostics</button>
				</div>
			</div>
		</div>
	</body>
</html>
