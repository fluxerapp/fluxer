[package]
name = "fluxer_mac_tcc"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = {version = "3.16.0", default-features = false, features = ["dyn-symbols", "napi8"]}
napi-derive = "3.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
objc2-io-kit = {version = "0.3.2", default-features = false, features = ["std", "hidsystem"]}

[build-dependencies]
napi-build = "2.6.0"
