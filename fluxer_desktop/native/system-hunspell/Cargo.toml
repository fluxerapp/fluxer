[package]
name = "fluxer_system_hunspell"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hunspell-sys = {version = "0.3.1", features = ["bundled"]}
napi = {version = "3.16.0", default-features = false, features = ["dyn-symbols", "napi8"]}
napi-derive = "3.7.0"

[build-dependencies]
napi-build = "2.6.0"
