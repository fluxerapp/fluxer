[package]
name = "fluxer_mac_screen_capture"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = {version = "3.12.6", default-features = false, features = ["dyn-symbols", "napi8", "async"]}
napi-derive = "3.6.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = {version = "0.3", features = ["NSError"]}
objc2-screen-capture-kit = {version = "0.3", features = ["SCShareableContent", "block2"]}
block2 = "0.6"

[build-dependencies]
napi-build = "2.4.3"
