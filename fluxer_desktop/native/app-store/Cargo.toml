[package]
name = "fluxer_app_store"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = {version = "3.12.6", default-features = false, features = ["dyn-symbols", "napi8"]}
napi-derive = "3.6.7"
rusqlite = {version = "0.40.1", features = ["bundled"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = {version = "1.0", features = ["raw_value"]}

[build-dependencies]
napi-build = "2.4.3"

[dev-dependencies]
tempfile = "3.27"
