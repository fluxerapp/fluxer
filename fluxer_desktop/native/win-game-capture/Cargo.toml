[package]
name = "fluxer_win_game_capture"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = {version = "3.16.0", default-features = false, features = ["dyn-symbols", "napi8"]}
napi-derive = "3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = {version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_WinRT_Graphics_Capture",
]}

[build-dependencies]
napi-build = "2.6.0"
