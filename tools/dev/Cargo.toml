[package]
name = "fluxer-dev"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
hex = "0.4.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
regex = "1.13"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
scylla = { version = "1.9.0", features = ["chrono-04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
url = "2.5.8"
