[package]
name = "fluxer-ci"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.0", optional = true }
aws-sdk-s3 = { version = "1.156.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio"], optional = true }
base64 = "0.23.1"
brotli = "9.1.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
md-5 = { version = "0.11.0", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[features]
default = ["s3", "http"]
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:md-5"]
http = ["dep:reqwest"]
