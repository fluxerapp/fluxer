services:
  livekit:
    image: ${FLUXER_LIVEKIT_IMAGE:-livekit/livekit-server:v1.12.0}
    restart: unless-stopped
    stop_grace_period: ${FLUXER_VOICE_STOP_GRACE:-15m}
    deploy:
      resources:
        limits:
          memory: ${FLUXER_VOICE_MEMORY_LIMIT:-2g}
    logging:
      driver: json-file
      options:
        max-size: ${FLUXER_LOG_MAX_SIZE:-10m}
        max-file: "${FLUXER_LOG_MAX_FILE:-3}"
    environment:
      GOMEMLIMIT: ${FLUXER_VOICE_GOMEMLIMIT:-1700MiB}
      LIVEKIT_KEYS: "${FLUXER_VOICE_API_KEY:?Set FLUXER_VOICE_API_KEY}: ${FLUXER_VOICE_API_SECRET:?Set FLUXER_VOICE_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: ${FLUXER_LIVEKIT_LOG_LEVEL:-info}
        rtc:
          tcp_port: ${FLUXER_VOICE_TCP_PORT:-7881}
          udp_port: ${FLUXER_VOICE_UDP_PORT:-7882}
          use_external_ip: ${FLUXER_VOICE_USE_EXTERNAL_IP:-true}
          node_ip: "${FLUXER_VOICE_NODE_IP:-}"
          ips:
            includes: ${FLUXER_VOICE_ICE_IPS:-[]}
          stun_servers:
            - ${FLUXER_LIVEKIT_STUN_PRIMARY:-stun.l.google.com:19302}
            - ${FLUXER_LIVEKIT_STUN_SECONDARY:-stun1.l.google.com:19302}
          turn_servers: ${FLUXER_LIVEKIT_TURN_SERVERS:-[]}
        turn:
          enabled: false
        webhook:
          api_key: ${FLUXER_VOICE_API_KEY:?Set FLUXER_VOICE_API_KEY}
          urls:
            - ${FLUXER_VOICE_WEBHOOK_URL:?Set FLUXER_VOICE_WEBHOOK_URL}
    ports:
      - "${FLUXER_VOICE_BIND_IP:+${FLUXER_VOICE_BIND_IP}:}${FLUXER_VOICE_TCP_PORT:-7881}:${FLUXER_VOICE_TCP_PORT:-7881}/tcp"
      - "${FLUXER_VOICE_BIND_IP:+${FLUXER_VOICE_BIND_IP}:}${FLUXER_VOICE_UDP_PORT:-7882}:${FLUXER_VOICE_UDP_PORT:-7882}/udp"
    networks:
      voice:
        aliases:
          - voice-${FLUXER_VOICE_ID:?Set FLUXER_VOICE_ID}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

networks:
  voice:
    external: true
    name: ${FLUXER_VOICE_NETWORK:-fluxer-voice}
