x-fluxer-rust-env: &fluxer-rust-env
  <<: *fluxer-env
  TOKIO_WORKER_THREADS: ${FLUXER_TOKIO_WORKER_THREADS:-2}
  MALLOC_ARENA_MAX: ${FLUXER_MALLOC_ARENA_MAX:-2}

x-fluxer-logging: &fluxer-logging
  driver: json-file
  options:
    max-size: ${FLUXER_LOG_MAX_SIZE:-10m}
    max-file: "${FLUXER_LOG_MAX_FILE:-3}"

x-fluxer-service: &fluxer-service
  restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
  networks: [fluxer]
  logging: *fluxer-logging

x-fluxer-healthcheck: &fluxer-healthcheck
  interval: ${FLUXER_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${FLUXER_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${FLUXER_HEALTHCHECK_RETRIES:-10}
  start_period: ${FLUXER_HEALTHCHECK_START_PERIOD:-60s}
  start_interval: ${FLUXER_HEALTHCHECK_START_INTERVAL:-1s}

x-fluxer-app-healthcheck: &fluxer-app-healthcheck
  interval: ${FLUXER_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${FLUXER_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${FLUXER_APP_HEALTHCHECK_RETRIES:-30}
  start_period: ${FLUXER_APP_HEALTHCHECK_START_PERIOD:-90s}
  start_interval: ${FLUXER_HEALTHCHECK_START_INTERVAL:-1s}

x-fluxer-svc-healthcheck: &fluxer-svc-healthcheck
  <<: *fluxer-app-healthcheck
  start_period: ${FLUXER_SVC_HEALTHCHECK_START_PERIOD:-60s}
  test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]

services:
  edge:
    <<: *fluxer-service
    image: ${FLUXER_CADDY_IMAGE:-caddy:2.11-alpine}
    deploy:
      resources:
        limits:
          memory: ${FLUXER_CADDY_MEMORY_LIMIT:-384mb}
    ports:
      - "${FLUXER_HTTP_PORT:-80}:80"
      - "${FLUXER_HTTPS_PORT:-443}:443"
      - "${FLUXER_HTTPS_PORT:-443}:443/udp"
    environment:
      FLUXER_EDGE_SITE_ADDRESS: ${FLUXER_EDGE_SITE_ADDRESS:-${FLUXER_CADDY_SITE_ADDRESS:-${FLUXER_PUBLIC_SCHEME:-https}://${FLUXER_DOMAIN:-}}}
      FLUXER_EDGE_TRUSTED_PROXIES: ${FLUXER_EDGE_TRUSTED_PROXIES:-127.0.0.1/32}
      FLUXER_EDGE_ENCODE: ${FLUXER_EDGE_ENCODE:-zstd gzip}
      FLUXER_EDGE_PROTOCOLS: ${FLUXER_EDGE_PROTOCOLS:-h1 h2 h3}
      FLUXER_EDGE_GLOBAL_OPTIONS: ${FLUXER_EDGE_GLOBAL_OPTIONS:-}
      FLUXER_EDGE_TLS_DIRECTIVE: ${FLUXER_EDGE_TLS:+tls ${FLUXER_EDGE_TLS:-}}
