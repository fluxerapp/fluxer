[package]
name = "fluxer-users"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false }
fluxer_common = { path = "../fluxer_common" }
fluxer-svc = { path = "../fluxer_svc" }
futures = "0.3.34"
moka = { version = "0.12.16", features = ["future"] }
rmp-serde = "1.3"
scylla = { version = "1.9.0", features = ["chrono-04"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"

[features]
default = []
scylla = ["dep:scylla", "fluxer-svc/scylla"]
