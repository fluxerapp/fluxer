[package]
name = "fluxer-users"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ciborium = "0.2.2"
fluxer_common = { path = "../fluxer_common" }
fluxer-svc = { path = "../fluxer_svc" }
futures = "0.3.34"
hmac = "0.13.0"
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
ring = "0.17.14"
scylla = { version = "1.9.0", features = ["chrono-04"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }

[features]
default = []
scylla = ["dep:scylla", "fluxer-svc/scylla"]
