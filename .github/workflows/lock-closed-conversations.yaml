name: Lock closed conversations

on:
  issues:
    types:
      - closed
  pull_request_target:
    types:
      - closed
  discussion:
    types:
      - answered
      - category_changed
      - created
      - edited
      - labeled
      - pinned
      - transferred
      - unanswered
      - unlabeled
      - unpinned
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report matching closed conversations without locking them.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions: {}

concurrency:
  group: lock-closed-conversations-${{ github.event.issue.number || github.event.pull_request.number || github.event.discussion.number || github.run_id }}
  cancel-in-progress: false

jobs:
  automatic:
    name: Lock closed conversation
    if: (github.repository == 'fluxerapp/fluxer' || github.repository == 'omstr/fluxer') && github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Create token
        id: create-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.FLUXER_CI_APP_ID }}
          private-key: ${{ secrets.FLUXER_CI_APP_KEY }}
          owner: fluxerapp
          repositories: fluxer
          permission-discussions: write
          permission-issues: write
          permission-pull-requests: write

      - name: Lock conversation
        env:
          GH_TOKEN: ${{ steps.create-token.outputs.token }}
        run: |
          set -euo pipefail

          lock_discussion() {
            local discussion_id="$1"

            gh api graphql \
              -f id="$discussion_id" \
              -f query="
                mutation(\$id: ID!) {
                  lockLockable(input: {lockableId: \$id}) {
                    lockedRecord {
                      locked
                    }
                  }
                }
              " \
              --silent
          }

          owner="${GITHUB_REPOSITORY%/*}"
          repository="${GITHUB_REPOSITORY#*/}"

          if [ "$GITHUB_EVENT_NAME" = "discussion" ]; then
            number="$(jq -r '.discussion.number // empty' "$GITHUB_EVENT_PATH")"
            if [ -z "$number" ]; then
              echo "Skipping discussion event; discussion number is unavailable."
              exit 0
            fi

            sleep 10

            discussion="$(
              gh api graphql \
                -F owner="$owner" \
                -F name="$repository" \
                -F number="$number" \
                -f query="
                  query(\$owner: String!, \$name: String!, \$number: Int!) {
                    repository(owner: \$owner, name: \$name) {
                      discussion(number: \$number) {
                        id
                        closed
                        locked
                      }
                    }
                  }
                "
            )"
            discussion_id="$(jq -r '.data.repository.discussion.id // empty' <<<"$discussion")"
            closed="$(jq -r '.data.repository.discussion.closed // empty' <<<"$discussion")"
            locked="$(jq -r '.data.repository.discussion.locked // empty' <<<"$discussion")"

            if [ -z "$discussion_id" ]; then
              echo "Skipping discussion #${number}; discussion is unavailable."
              exit 0
            fi

            if [ "$closed" != "true" ]; then
              echo "Skipping discussion #${number}; discussion is not closed."
              exit 0
            fi

            if [ "$locked" = "true" ]; then
              echo "Skipping discussion #${number}; conversation is already locked."
              exit 0
            fi

            lock_discussion "$discussion_id"
            exit 0
          fi

          number="$(jq -r '.issue.number // .pull_request.number' "$GITHUB_EVENT_PATH")"
          sleep 10

          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}")"
          state="$(jq -r '.state' <<<"$issue")"
          locked="$(jq -r '.locked' <<<"$issue")"

          if [ "$state" != "closed" ]; then
            echo "Skipping #${number}; state is ${state}."
            exit 0
          fi

          if [ "$locked" = "true" ]; then
            echo "Skipping #${number}; conversation is already locked."
            exit 0
          fi

          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/issues/${number}/lock" \
            --field lock_reason=resolved

  close_discussions:
    name: Close discussions referenced by a merged pull request
    if: github.repository == 'fluxerapp/fluxer' && github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Create token
        id: create-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.FLUXER_CI_APP_ID }}
          private-key: ${{ secrets.FLUXER_CI_APP_KEY }}
          owner: fluxerapp
          repositories: fluxer
          permission-discussions: write
          permission-pull-requests: read

      - name: Close discussions
        env:
          GH_TOKEN: ${{ steps.create-token.outputs.token }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%/*}"
          repository="${GITHUB_REPOSITORY#*/}"

          number="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
          body="$(jq -r '.pull_request.body // empty' "$GITHUB_EVENT_PATH")"

          if [ -z "$body" ]; then
            echo "PR #${number} has no body; nothing to close."
            exit 0
          fi

          ref_re='\b(Closes?|closes?)[[:space:]]+#[0-9]+'

          references="$(grep -oEi "$ref_re" <<<"$body" || true)"

          if [ -z "$references" ]; then
            echo "PR #${number} contains no closing-keyword references."
            exit 0
          fi

          echo "Closing-keyword references found in PR #${number}:"
          printf '%s\n' "$references" | sed 's/^/  - /'

          query() {
            gh api graphql \
              -F owner="$owner" \
              -F name="$repository" \
              -F number="$1" \
              -f query='
                query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    discussion(number: $number) {
                      id
                      closed
                      body
                    }
                  }
                }
              '
          }

          MAX_VISITS=3

          while IFS= read -r reference; do
            [ -z "$reference" ] && continue

            root_number="$(grep -oE '[0-9]+$' <<<"$reference" || true)"
            [ -z "$root_number" ] && continue

            queue="$root_number"
            visited=""
            visits=0

            while [ -n "$queue" ] && [ "$visits" -lt "$MAX_VISITS" ]; do
              if [[ "$queue" == *" "* ]]; then
                current="${queue%% *}"
                queue="${queue#* }"
              else
                current="$queue"
                queue=""
              fi

              if [[ " $visited " == *" $current "* ]]; then
                continue
              fi
              visited="${visited}${visited:+ }${current}"
              visits=$((visits + 1))

              discussion="$(query "$current")"
              discussion_id="$(jq -r '.data.repository.discussion.id     // empty' <<<"$discussion")"
              closed="$(jq -r         '.data.repository.discussion.closed // empty' <<<"$discussion")"
              discussion_body="$(jq -r '.data.repository.discussion.body  // empty' <<<"$discussion")"

              if [ -z "$discussion_id" ]; then
                echo "Reference #${current} is not a discussion; skipping."
                continue
              fi

              # Enqueue nested references from this discussion's body
              nested_refs="$(grep -oEi "$ref_re" <<<"$discussion_body" || true)"
              while IFS= read -r nested; do
                [ -z "$nested" ] && continue
                nested_num="$(grep -oE '[0-9]+$' <<<"$nested" || true)"
                [ -z "$nested_num" ] && continue
                if [[ " $visited " != *" $nested_num "* ]] \
                  && [[ " $queue " != *" $nested_num "* ]]; then
                  queue="${queue}${queue:+ }${nested_num}"
                fi
              done <<<"$nested_refs"

              if [ "$closed" = "true" ]; then
                echo "Discussion #${current} is already closed."
                continue
              fi

              if [ "$current" = "$root_number" ]; then
                comment_body="Closed via merged PR #${number}."
              else
                comment_body="Closed via discussion #${root_number}"
              fi

              echo "Closing discussion #${current}..."
              gh api graphql \
                -F id="$discussion_id" \
                -F body="$comment_body" \
                -F clientId="close-comment-discussion-${number}-${current}" \
                -f query='
                  mutation($id: ID!, $body: String!, $clientId: String!) {
                    addDiscussionComment(input: {discussionId: $id, body: $body, clientMutationId: $clientId}) {
                      comment { id }
                    }
                    closeDiscussion(input: {discussionId: $id, reason: RESOLVED}) {
                      discussion { closed }
                    }
                  }
                ' \
                --silent
            done
          done <<<"$references"

  retroactive:
    name: Lock closed conversations retroactively
    if: github.repository == 'fluxerapp/fluxer' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Create token
        id: create-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.FLUXER_CI_APP_ID }}
          private-key: ${{ secrets.FLUXER_CI_APP_KEY }}
          owner: fluxerapp
          repositories: fluxer
          permission-discussions: write
          permission-issues: write
          permission-pull-requests: write

      - name: Lock closed conversations
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          GH_TOKEN: ${{ steps.create-token.outputs.token }}
        run: |
          set -euo pipefail

          lock_discussion() {
            local discussion_id="$1"

            gh api graphql \
              -f id="$discussion_id" \
              -f query="
                mutation(\$id: ID!) {
                  lockLockable(input: {lockableId: \$id}) {
                    lockedRecord {
                      locked
                    }
                  }
                }
              " \
              --silent
          }

          owner="${GITHUB_REPOSITORY%/*}"
          repository="${GITHUB_REPOSITORY#*/}"

          count=0
          while IFS=$'\t' read -r number kind; do
            count=$((count + 1))

            if [ "$DRY_RUN" = "true" ]; then
              echo "Would lock ${kind} #${number} as resolved."
              continue
            fi

            echo "Locking ${kind} #${number} as resolved."
            gh api \
              --method PUT \
              "repos/${GITHUB_REPOSITORY}/issues/${number}/lock" \
              --field lock_reason=resolved \
              --silent
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=closed&per_page=100" \
              --jq '.[] | select(.locked == false) | [.number, (if has("pull_request") then "pull request" else "issue" end)] | @tsv'
          )

          while IFS=$'\t' read -r discussion_id number; do
            count=$((count + 1))

            if [ "$DRY_RUN" = "true" ]; then
              echo "Would lock discussion #${number} as resolved."
              continue
            fi

            echo "Locking discussion #${number} as resolved."
            lock_discussion "$discussion_id"
          done < <(
            gh api graphql --paginate \
              -F owner="$owner" \
              -F name="$repository" \
              -f query="
                query(\$owner: String!, \$name: String!, \$endCursor: String) {
                  repository(owner: \$owner, name: \$name) {
                    discussions(first: 100, after: \$endCursor, states: CLOSED, orderBy: {field: UPDATED_AT, direction: DESC}) {
                      nodes {
                        id
                        number
                        locked
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              " \
              --jq '.data.repository.discussions.nodes[] | select(.locked == false) | [.id, .number] | @tsv'
          )

          if [ "$count" -eq 0 ]; then
            echo "No unlocked closed conversations found."
          fi
