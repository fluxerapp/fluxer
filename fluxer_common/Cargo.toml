[package]
name = "fluxer_common"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter"] }
base64 = "0.23"
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"
thiserror = "2"

[dev-dependencies]
tempfile = "3.27.0"
url = "2.5.8"
