[package]
name = "fluxer_common"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
http = "1"
tokio = { version = "1.53.1", features = ["signal", "macros"] }
tracing = "0.1.44"
url = "2.5.8"
anyhow = "1.0.104"
serde_json = "1.0.151"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter"] }
base64 = "0.23"
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"
thiserror = "2"

[dev-dependencies]
tempfile = "3.27.0"

[features]
healthcheck = ["dep:reqwest"]
